<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="80년대 레트로 BGM과 춤추는 캐릭터가 함께하는 나만의 테트리스 웹 게임">

  <meta property="og:type" content="website">
  <meta property="og:title" content="진용이가 만든 테트리스">
  <meta property="og:description" content="80년대 레트로 BGM과 춤추는 캐릭터가 함께하는 나만의 테트리스 웹 게임! 지금 플레이해보세요.">

  <!-- Twitter Card -->

  <meta name="twitter:title" content="진용이가 만든 테트리스">
  <meta name="twitter:description" content="80년대 레트로 BGM과 춤추는 캐릭터가 함께하는 나만의 테트리스 웹 게임! 지금 플레이해보세요.">
  <meta name="twitter:image" content="og.png">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #24243a 0%, #12121b 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    /* 상단 춤추는 러시아 아저씨 */
    .dancer-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
    }
    .dancer-svg {
      width: 75px;
      height: 75px;
      overflow: visible;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
    }

    .dancing #body-torso {
      animation: squatBounce 0.45s infinite alternate ease-in-out;
      transform-origin: 50px 70px;
    }
    .dancing #left-arm {
      animation: armDanceL 0.45s infinite alternate ease-in-out;
      transform-origin: 36px 44px;
    }
    .dancing #right-arm {
      animation: armDanceR 0.45s infinite alternate ease-in-out;
      transform-origin: 64px 44px;
    }
    .dancing #left-leg {
      animation: kickLeft 0.45s infinite alternate ease-in-out;
      transform-origin: 40px 66px;
    }
    .dancing #right-leg {
      animation: kickRight 0.45s infinite alternate ease-in-out;
      transform-origin: 60px 66px;
    }

    .hyper-dancing #body-torso {
      animation: squatBounce 0.22s infinite alternate ease-in-out !important;
    }
    .hyper-dancing #left-arm {
      animation: armDanceL 0.22s infinite alternate ease-in-out !important;
    }
    .hyper-dancing #right-arm {
      animation: armDanceR 0.22s infinite alternate ease-in-out !important;
    }
    .hyper-dancing #left-leg {
      animation: kickLeft 0.22s infinite alternate ease-in-out !important;
    }
    .hyper-dancing #right-leg {
      animation: kickRight 0.22s infinite alternate ease-in-out !important;
    }

    @keyframes squatBounce {
      0% { transform: translateY(0) scaleY(1); }
      100% { transform: translateY(6px) scaleY(0.92); }
    }
    @keyframes armDanceL {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(35deg); }
    }
    @keyframes armDanceR {
      0% { transform: rotate(35deg); }
      100% { transform: rotate(-20deg); }
    }
    @keyframes kickLeft {
      0% { transform: rotate(-35deg) scaleX(1.1); }
      100% { transform: rotate(10deg); }
    }
    @keyframes kickRight {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(40deg) scaleX(1.1); }
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .game-container {
      display: flex;
      gap: 20px;
      background: #202033;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
    }

    /* 테트리스 캔버스 래퍼 */
    .canvas-wrap {
      position: relative;
      width: 240px;
      height: 400px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #363654;
      background: #000;
    }

    .board-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('back.png');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
      filter: brightness(0.9) contrast(1.05);
      transition: filter 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      z-index: 1;
    }

    .board-bg.happy {
      opacity: 0.85;
      filter: brightness(1.3) saturate(1.4) drop-shadow(0 0 12px #fffa65);
      transform: scale(1.08) rotate(1deg);
      animation: joyfulBounce 0.5s ease-out;
    }

    .board-bg.danger {
      opacity: 0.7;
      filter: brightness(0.7) sepia(0.8) hue-rotate(310deg) saturate(3);
      animation: tremble 0.2s infinite;
    }

    .board-bg.sad {
      opacity: 0.25;
      filter: grayscale(1) brightness(0.4);
      transform: scale(0.98);
    }

    @keyframes joyfulBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.12) translateY(-4px); }
      70% { transform: scale(1.04) translateY(2px); }
      100% { transform: scale(1.08); }
    }

    @keyframes tremble {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-1px, -2px) rotate(-1deg); }
      50% { transform: translate(-2px, 0px) rotate(1deg); }
      75% { transform: translate(2px, 1px) rotate(0deg); }
      100% { transform: translate(1px, -1px) rotate(0deg); }
    }

    #tetris {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      background-color: transparent;
      display: block;
    }

    /* 스테이지 시작/공지 알림 배너 */
    .stage-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: rgba(13, 17, 23, 0.92);
      border: 2px solid #00e5ff;
      border-radius: 12px;
      padding: 14px 20px;
      text-align: center;
      z-index: 8;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: 85%;
    }
    .stage-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .stage-banner h2 {
      margin: 0;
      font-size: 20px;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00e5ff;
    }
    .stage-banner p {
      margin: 6px 0 0 0;
      font-size: 13px;
      color: #ffd152;
      font-weight: 600;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 140px;
    }
    .info-box {
      background: #171726;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #31314d;
    }
    .info-box h3 {
      margin: 0 0 4px 0;
      font-size: 11px;
      color: #9d96fc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .info-box p {
      margin: 0;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }
    
    /* 다음 블록 미리보기 컨테이너 */
    .next-canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #11111a;
      border-radius: 6px;
      border: 1px solid #28283d;
      height: 64px;
      margin-top: 4px;
    }
    #next-canvas {
      display: block;
      background: transparent;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }
    button {
      background: #00e5ff;
      color: #0d1117;
      border: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.3);
      transition: all 0.2s;
    }
    button:hover {
      background: #38eeff;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
    .btn-secondary {
      background: #353552;
      color: #fff;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #47476c;
    }
    .controls-guide {
      font-size: 10px;
      color: #9e9eb4;
      line-height: 1.5;
    }

    /* 게임 오버 오버레이 모달 */
    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 24, 0.88);
      backdrop-filter: blur(5px);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .game-over-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .game-over-title {
      font-size: 26px;
      font-weight: 900;
      color: #ff3366;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
      text-shadow: 0 0 14px rgba(255, 51, 102, 0.7);
    }
    .game-over-stats {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 18px;
      margin-bottom: 20px;
      width: 85%;
    }
    .game-over-stats p {
      margin: 5px 0;
      font-size: 13px;
      color: #cfcfe2;
      display: flex;
      justify-content: space-between;
    }
    .game-over-stats span {
      font-weight: bold;
      color: #00e5ff;
    }
    .btn-restart {
      background: linear-gradient(135deg, #00e5ff, #7928ca);
      color: white;
      padding: 11px 22px;
      font-size: 14px;
      border-radius: 25px;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
      cursor: pointer;
    }
    .btn-restart:hover {
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
      transform: translateY(-2px);
    }

    /* 모바일 가상 패드 */
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 15px;
      width: 100%;
      max-width: 300px;
    }
    .touch-btn {
      background: #2e2e46;
      color: #fff;
      font-size: 16px;
      padding: 12px 0;
      border-radius: 6px;
      box-shadow: none;
    }
    .touch-btn:active {
      background: #444468;
    }
    .wide-btn {
      grid-column: span 3;
      background: #4844b3;
    }

    @media (max-width: 480px) {
      .game-container {
        flex-direction: column;
        align-items: center;
      }
      .sidebar {
        width: 100%;
        flex-direction: row;
        gap: 8px;
      }
      .info-box {
        margin-bottom: 0;
        flex: 1;
        padding: 8px;
      }
      .controls-guide {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 배경음악 (동일 폴더 bgm.mp3) -->
  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

  <!-- 테트리스 상단 춤추는 러시아 아저씨 -->
  <div class="dancer-stage">
    <div id="dancer-container" class="dancer-svg">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <ellipse cx="50" cy="94" rx="24" ry="5" fill="rgba(0,0,0,0.3)" />

        <g id="left-leg">
          <path d="M 40 68 L 22 84 L 14 84 L 14 91 L 28 91 L 43 72 Z" fill="#151522" stroke="#d63031" stroke-width="1.5" />
          <polygon points="12,83 23,83 26,93 10,93" fill="#8b0000" />
        </g>
        <g id="right-leg">
          <path d="M 60 68 L 78 84 L 86 84 L 86 91 L 72 91 L 57 72 Z" fill="#151522" stroke="#d63031" stroke-width="1.5" />
          <polygon points="77,83 88,83 90,93 74,93" fill="#8b0000" />
        </g>

        <g id="body-torso">
          <path d="M 36 44 L 64 44 L 67 68 L 33 68 Z" fill="#d63031" />
          <rect x="33" y="62" width="34" height="6" fill="#f1c40f" rx="1" />
          <rect x="47" y="61" width="6" height="8" fill="#e67e22" />

          <g id="left-arm">
            <path d="M 36 46 L 16 54 L 20 62 L 35 55 Z" fill="#b71515" />
            <circle cx="16" cy="58" r="4.5" fill="#fcd3a1" />
          </g>
          <g id="right-arm">
            <path d="M 64 46 L 84 54 L 80 62 L 65 55 Z" fill="#b71515" />
            <circle cx="84" cy="58" r="4.5" fill="#fcd3a1" />
          </g>

          <rect x="46" y="38" width="8" height="6" fill="#fcd3a1" />
          <circle cx="50" cy="30" r="13" fill="#fcd3a1" />
          <ellipse cx="50" cy="30" rx="2.5" ry="3.5" fill="#f3a683" />
          <circle cx="45" cy="26" r="1.8" fill="#2d3436" />
          <circle cx="55" cy="26" r="1.8" fill="#2d3436" />
          <path d="M 40 33 Q 50 30 60 33 Q 64 39 58 37 Q 50 35 42 37 Q 36 39 40 33 Z" fill="#59300b" />
          <path d="M 47 38 Q 50 41 53 38" stroke="#a0300a" stroke-width="1.8" fill="none" stroke-linecap="round" />

          <path d="M 33 22 C 33 10, 67 10, 67 22 Z" fill="#2c3e50" />
          <rect x="31" y="19" width="38" height="7" rx="3" fill="#7f8c8d" />
          <path d="M 31 22 L 28 34 L 35 34 L 35 24 Z" fill="#7f8c8d" />
          <path d="M 69 22 L 72 34 L 65 34 L 65 24 Z" fill="#7f8c8d" />
          <polygon points="50,15 51.5,19 55.5,19 52.3,21.5 53.5,25.5 50,23 46.5,25.5 47.7,21.5 44.5,19 48.5,19" fill="#e74c3c" />
        </g>
      </svg>
    </div>
  </div>

  <h1>진용이가 만든 테트리스</h1>

  <div class="game-container">
    <div class="canvas-wrap">
      <!-- 배경 이미지 (back.png) -->
      <div id="board-bg" class="board-bg"></div>

      <!-- 메인 테트리스 캔버스 -->
      <canvas id="tetris" width="240" height="400"></canvas>

      <!-- 스테이지 안내 배너 -->
      <div id="stage-banner" class="stage-banner">
        <h2 id="banner-title">STAGE 1</h2>
        <p id="banner-desc">목표: 5줄 제거</p>
      </div>

      <!-- 게임오버 모달 -->
      <div id="game-over-overlay" class="game-over-overlay">
        <h2 id="game-over-title" class="game-over-title">GAME OVER</h2>
        <div class="game-over-stats">
          <p>최종 스테이지: <span id="final-stage">1</span></p>
          <p>최종 점수: <span id="final-score">0</span></p>
          <p>제거한 줄: <span id="final-lines">0</span></p>
        </div>
        <button id="retry-btn" class="btn-restart">다시 도전하기 ↻</button>
      </div>
    </div>

    <!-- 우측 사이드바 -->
    <div class="sidebar">
      <div>
        <!-- 다음 블록 박스 -->
        <div class="info-box">
          <h3>다음 블록</h3>
          <div class="next-canvas-container">
            <canvas id="next-canvas" width="80" height="60"></canvas>
          </div>
        </div>

        <div class="info-box">
          <h3>스테이지</h3>
          <p id="stage">1</p>
        </div>
        <div class="info-box">
          <h3>점수</h3>
          <p id="score">0</p>
        </div>
        <div class="info-box">
          <h3>남은 줄</h3>
          <p id="lines-left">5</p>
        </div>
        <div class="info-box controls-guide">
          <h3>조작법</h3>
          ← / → : 이동<br>
          ↑ : 회전<br>
          ↓ : 소프트 드롭<br>
          Space : 하드 드롭
        </div>
      </div>
      <div class="btn-group">
        <button id="start-btn">게임 시작</button>
        <button id="music-toggle-btn" class="btn-secondary">BGM: ON</button>
      </div>
    </div>
  </div>

  <!-- 모바일 가상 패드 -->
  <div class="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-rotate">↻</button>
    <button class="touch-btn" id="btn-right">▶</button>
    <button class="touch-btn wide-btn" id="btn-down">▼ 빠른 내리기</button>
    <button class="touch-btn wide-btn" id="btn-drop">⤓ 하드 드롭</button>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextContext = nextCanvas.getContext('2d');

    const scoreElement = document.getElementById('score');
    const stageElement = document.getElementById('stage');
    const linesLeftElement = document.getElementById('lines-left');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const musicToggleBtn = document.getElementById('music-toggle-btn');
    const bgm = document.getElementById('bgm');

    const stageBanner = document.getElementById('stage-banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerDesc = document.getElementById('banner-desc');

    const gameOverOverlay = document.getElementById('game-over-overlay');
    const gameOverTitle = document.getElementById('game-over-title');
    const finalStageEl = document.getElementById('final-stage');
    const finalScoreEl = document.getElementById('final-score');
    const finalLinesEl = document.getElementById('final-lines');
    const dancerContainer = document.getElementById('dancer-container');
    const boardBg = document.getElementById('board-bg');

    bgm.volume = 0.5;
    let isMusicMuted = false;
    let happyTimer = null;
    let isTransitioning = false; // 스테이지 전환/채우기 애니메이션 중 플래그

    // Web Audio API를 활용한 자체 '뽕' 사운드 합성기
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPopSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const now = audioCtx.currentTime;
        // 주파수를 짧은 시간에 급격히 올려 톡 튀는 '뽕!' 효과음 구현
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.16);
      } catch (e) {
        // 브라우저 권한 제약 시 무시
      }
    }

    const BLOCK_SIZE = 20;
    const COLS = 12;
    const ROWS = 20;

    context.scale(BLOCK_SIZE, BLOCK_SIZE);

    const COLORS = [
      null,
      '#FF0D72', // T
      '#0DC2FF', // I
      '#0DFF72', // S
      '#F538FF', // Z
      '#FF8E0D', // L
      '#FFE138', // J
      '#3877FF'  // O
    ];

    function createPiece(type) {
      if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
      if (type === 'I') return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
      if (type === 'S') return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
      if (type === 'Z') return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
      if (type === 'L') return [[0, 5, 0], [0, 5, 0], [0, 5, 5]];
      if (type === 'J') return [[0, 6, 0], [0, 6, 0], [6, 6, 0]];
      if (type === 'O') return [[7, 7], [7, 7]];
    }

    function createMatrix(width, height) {
      const matrix = [];
      while (height--) {
        matrix.push(new Array(width).fill(0));
      }
      return matrix;
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
      checkDangerLevel();
    }

    function checkDangerLevel() {
      if (!isRunning || isTransitioning) return;
      let hasDanger = false;
      for (let y = 0; y < 6; y++) {
        if (arena[y].some(val => val !== 0)) {
          hasDanger = true;
          break;
        }
      }
      if (hasDanger) {
        boardBg.classList.add('danger');
      } else {
        boardBg.classList.remove('danger');
      }
    }

    function triggerHappyReaction() {
      boardBg.classList.remove('danger');
      boardBg.classList.add('happy');
      dancerContainer.classList.add('hyper-dancing');

      if (happyTimer) clearTimeout(happyTimer);
      happyTimer = setTimeout(() => {
        boardBg.classList.remove('happy');
        dancerContainer.classList.remove('hyper-dancing');
        checkDangerLevel();
      }, 900);
    }

    // 각 스테이지 요구 라인 수 계산 (1스테이지: 5줄, 2스테이지: 7줄...)
    function getLinesRequiredForStage(s) {
      return 5 + (s - 1) * 2;
    }

    // 10판마다 속도 가속
    function updateSpeed() {
      const tier = Math.floor((player.stage - 1) / 10);
      dropInterval = Math.max(250, 1000 - tier * 250);
    }

    // 스테이지 시작 배너 공지
    function announceStage(stageNum, callback) {
      if (stageNum === 30) {
        bannerTitle.innerText = "THE LAST STAGE";
        bannerDesc.innerText = `마지막 결전: ${getLinesRequiredForStage(30)}줄 제거!`;
      } else {
        bannerTitle.innerText = `STAGE ${stageNum}`;
        bannerDesc.innerText = `목표: ${getLinesRequiredForStage(stageNum)}줄 제거`;
      }

      stageBanner.classList.add('show');
      setTimeout(() => {
        stageBanner.classList.remove('show');
        if (callback) callback();
      }, 1600);
    }

    // 스테이지 클리어 시 보드를 테트리스로 가득 채우는 축하 연출
    function playStageClearFillEffect(onComplete) {
      isTransitioning = true;
      let currentRow = ROWS - 1;

      const fillInterval = setInterval(() => {
        if (currentRow >= 0) {
          for (let x = 0; x < COLS; x++) {
            // 다양한 색상 블록으로 화려하게 채우기
            arena[currentRow][x] = ((x + currentRow) % 7) + 1;
          }
          draw();
          currentRow--;
        } else {
          clearInterval(fillInterval);
          setTimeout(() => {
            // 채워진 보드 초기화 후 다음 스테이지 진입
            arena.forEach(row => row.fill(0));
            draw();
            isTransitioning = false;
            if (onComplete) onComplete();
          }, 600);
        }
      }, 35);
    }

    // 중력 적용 (공중에 뜬 블록을 아래로 떨어뜨림)
    function applyGravity() {
      let moved = false;
      for (let x = 0; x < COLS; x++) {
        for (let y = ROWS - 2; y >= 0; y--) {
          if (arena[y][x] !== 0 && arena[y + 1][x] === 0) {
            let targetY = y;
            while (targetY + 1 < ROWS && arena[targetY + 1][x] === 0) {
              arena[targetY + 1][x] = arena[targetY][x];
              arena[targetY][x] = 0;
              targetY++;
              moved = true;
            }
          }
        }
      }
      return moved;
    }

    // 한 줄 완성 검사 및 중력 연쇄(Cascade) 삭제 루프
    function arenaSweepCascade() {
      let totalClearedLines = 0;

      while (true) {
        let clearedThisTurn = 0;
        outer: for (let y = arena.length - 1; y >= 0; --y) {
          for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
              continue outer;
            }
          }

          const row = arena.splice(y, 1)[0].fill(0);
          arena.unshift(row);
          ++y;
          clearedThisTurn++;
        }

        if (clearedThisTurn > 0) {
          totalClearedLines += clearedThisTurn;
          playPopSound(); // 줄이 사라질 때 뽕! 효과음 재생
          applyGravity(); // 밑에 빈 칸이 있으면 남은 퍼즐 조각이 낙하
        } else {
          break; // 더 이상 완성된 줄이 없으면 종료
        }
      }

      if (totalClearedLines > 0) {
        updateStageProgress(totalClearedLines);
      }
    }

    function updateStageProgress(rowCount) {
      player.score += rowCount * 10 * rowCount;
      player.lines += rowCount;
      player.stageLinesLeft -= rowCount;

      triggerHappyReaction();

      // 현재 스테이지 목표 달성 시
      if (player.stageLinesLeft <= 0) {
        if (player.stage < 30) {
          // 스테이지 클리어 연출 (화면 가득 채우기)
          playStageClearFillEffect(() => {
            player.stage++;
            player.stageLinesLeft = getLinesRequiredForStage(player.stage);
            updateSpeed();
            updateUI();

            // 다음 스테이지 시작 공지
            announceStage(player.stage, () => {
              playerReset();
            });
          });
        } else {
          triggerVictory();
        }
      } else {
        updateUI();
      }
    }

    // 메인 게임 보드 렌더링
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            context.lineWidth = 0.05;
            context.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 다음 블록 미리보기 렌더링
    function drawNextPiece() {
      nextContext.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!player.nextMatrix) return;

      const matrix = player.nextMatrix;
      const size = 14;
      const pieceWidth = matrix[0].length * size;
      const pieceHeight = matrix.length * size;

      const startX = Math.floor((nextCanvas.width - pieceWidth) / 2);
      const startY = Math.floor((nextCanvas.height - pieceHeight) / 2);

      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            const px = startX + x * size;
            const py = startY + y * size;

            nextContext.fillStyle = COLORS[value];
            nextContext.fillRect(px, py, size, size);

            nextContext.lineWidth = 1;
            nextContext.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            nextContext.strokeRect(px, py, size, size);
          }
        });
      });
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 });
      if (player.matrix && !isTransitioning) {
        drawMatrix(player.matrix, player.pos);
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate(dir) {
      if (isTransitioning) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerDrop() {
      if (isTransitioning) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        arenaSweepCascade(); // 줄 삭제 + 중력 연쇄 적용
        if (!isTransitioning) {
          playerReset();
        }
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      if (isTransitioning) return;
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      arenaSweepCascade(); // 줄 삭제 + 중력 연쇄 적용
      if (!isTransitioning) {
        playerReset();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (isTransitioning) return;
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function triggerGameOver() {
      isRunning = false;
      bgm.pause();
      dancerContainer.classList.remove('dancing', 'hyper-dancing');

      boardBg.classList.remove('happy', 'danger');
      boardBg.classList.add('sad');

      gameOverTitle.innerText = "GAME OVER";
      gameOverTitle.style.color = "#ff3366";

      finalStageEl.innerText = player.stage === 30 ? "The Last Stage" : player.stage;
      finalScoreEl.innerText = player.score;
      finalLinesEl.innerText = player.lines;

      gameOverOverlay.classList.add('active');
    }

    function triggerVictory() {
      isRunning = false;
      bgm.pause();
      dancerContainer.classList.remove('dancing', 'hyper-dancing');
      boardBg.classList.remove('happy', 'danger', 'sad');

      gameOverTitle.innerText = "ALL CLEAR! 🎉";
      gameOverTitle.style.color = "#00e5ff";

      finalStageEl.innerText = "The Last Stage (완전 정복)";
      finalScoreEl.innerText = player.score;
      finalLinesEl.innerText = player.lines;

      gameOverOverlay.classList.add('active');
    }

    function getRandomPiece() {
      const pieces = 'ILJOTSZ';
      return createPiece(pieces[(pieces.length * Math.random()) | 0]);
    }

    function playerReset() {
      if (!player.nextMatrix) {
        player.nextMatrix = getRandomPiece();
      }
      player.matrix = player.nextMatrix;
      player.nextMatrix = getRandomPiece();
      
      drawNextPiece();

      player.pos.y = 0;
      player.pos.x = ((arena[0].length / 2) | 0) - ((player.matrix[0].length / 2) | 0);

      if (collide(arena, player)) {
        triggerGameOver();
      }
    }

    function updateUI() {
      scoreElement.innerText = player.score;
      stageElement.innerText = player.stage === 30 ? "The Last Stage" : `${player.stage} / 30`;
      linesLeftElement.innerText = Math.max(0, player.stageLinesLeft);
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isRunning = false;

    function update(time = 0) {
      if (!isRunning) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isTransitioning) {
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    const arena = createMatrix(COLS, ROWS);
    const player = {
      pos: { x: 0, y: 0 },
      matrix: null,
      nextMatrix: null,
      score: 0,
      lines: 0,
      stage: 1,
      stageLinesLeft: 5
    };

    function startNewGame() {
      initAudio();
      gameOverOverlay.classList.remove('active');
      boardBg.classList.remove('sad', 'danger', 'happy');

      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.stage = 1;
      player.stageLinesLeft = getLinesRequiredForStage(1);
      updateSpeed();
      updateUI();

      bgm.currentTime = 0;
      bgm.play().catch(e => console.log('BGM 재생 대기:', e));

      dancerContainer.classList.add('dancing');

      player.nextMatrix = null;
      startBtn.innerText = '재시작';

      // 스테이지 1 시작 공지 배너 후 게임 시작
      announceStage(1, () => {
        playerReset();
        if (!isRunning) {
          isRunning = true;
          lastTime = performance.now();
          update();
        }
      });
    }

    // 키보드 조작
    document.addEventListener('keydown', event => {
      if (!isRunning || isTransitioning) return;

      if (event.keyCode === 37) { // Left
        playerMove(-1);
      } else if (event.keyCode === 39) { // Right
        playerMove(1);
      } else if (event.keyCode === 40) { // Down
        playerDrop();
      } else if (event.keyCode === 38) { // Up
        playerRotate(1);
      } else if (event.keyCode === 32) { // Space
        event.preventDefault();
        playerHardDrop();
      }
    });

    // 모바일 조작 버튼
    document.getElementById('btn-left').addEventListener('click', () => isRunning && playerMove(-1));
    document.getElementById('btn-right').addEventListener('click', () => isRunning && playerMove(1));
    document.getElementById('btn-rotate').addEventListener('click', () => isRunning && playerRotate(1));
    document.getElementById('btn-down').addEventListener('click', () => isRunning && playerDrop());
    document.getElementById('btn-drop').addEventListener('click', () => isRunning && playerHardDrop());

    musicToggleBtn.addEventListener('click', () => {
      isMusicMuted = !isMusicMuted;
      bgm.muted = isMusicMuted;
      musicToggleBtn.innerText = isMusicMuted ? 'BGM: OFF' : 'BGM: ON';
    });

    startBtn.addEventListener('click', startNewGame);
    retryBtn.addEventListener('click', startNewGame);

    draw();
  </script>
</body>
</html>
